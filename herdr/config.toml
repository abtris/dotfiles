onboarding = false

[theme.custom]
# surface_dim colors the sidebar/main divider line; the catppuccin default
# (#1e1e2e) matches the terminal background, making the divider invisible.
surface_dim = "#313244"

[keys]
previous_workspace = "prefix+up"
next_workspace = "prefix+down"
# Bound to a plain, easy-to-remember prefix chord so the Ghostty key mapping
# for cmd+shift+[ / cmd+shift+] just has to send prefix + this literal char.
# Tab switching, not pane cycling — tabs are the thing usually being switched.
previous_tab = "prefix+["
next_tab = "prefix+]"

[[keys.command]]
key = "cmd+p"
type = "shell"
command = "herdr plugin action invoke cloudmanic.herdr-plus.projects"

# Opens the Jira/PR popup: open the PR or issue in a browser, assign a ticket by
# hand, refresh. A direct cmd+ chord on purpose — Herdr binds no cmd+ keys, while
# most prefix+ letters are taken, and a custom binding that collides with a
# built-in is silently disabled (prefix+j is focus_pane_down, prefix+o is
# open_notification_target).
[[keys.command]]
key = "cmd+j"
type = "shell"
command = "herdr plugin pane open --plugin abtris.jira-pr --entrypoint menu"
description = "Jira/PR popup"

# The file viewer opens only from these keys — its manifest declares no event
# hooks, so nothing spawns it unasked. cmd+ chords again, for the reason above.
# Not the README's prefix+f (silent-collision trap), and not cmd+f/cmd+shift+f
# either: Ghostty takes those for start_search / end_search and consumes them
# before herdr sees them. `ghostty +list-keybinds` is the way to check — the
# keybind lines in ghostty/config are overrides and do not list the defaults.
[[keys.command]]
key = "cmd+o"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "File viewer (split)"

[[keys.command]]
key = "cmd+shift+o"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "File viewer (tab)"

# Ghostty has no way to make bare file paths clickable (its custom `link`
# regex config is an unshipped TODO upstream, only real URI schemes work).
# Workaround: copy_on_select already puts the mouse selection on the
# clipboard, so this just opens whatever's on it — select a "path:line"
# string with the mouse, then press cmd+u.
[[keys.command]]
key = "cmd+u"
type = "shell"
command = "/opt/homebrew/bin/code -g \"$(pbpaste | xargs)\""
description = "Open clipboard path in VS Code"

# $jira comes from the abtris.jira-pr plugin: the Jira issue behind the current
# branch's PR, or a warning when the branch and the PR name different issues.
# Declaring rows replaces the defaults, so the first two lines repeat them.
#
# The three $cache_* tokens come from the cache-ttl plugin and are mutually
# exclusive — exactly one renders, picked by the prompt cache's remaining TTL
# (green, amber under 10 minutes, red under 5 or expired). All three go on the
# agent row so the countdown sits beside the agent it belongs to.
[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  [
    "agent",
    { token = "$cache_ok", fg = "#4ade80" },
    { token = "$cache_warn", fg = "#f59e0b" },
    { token = "$cache_crit", fg = "#ef4444" },
  ],
  ["$jira"],
]
